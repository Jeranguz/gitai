[project]
name = "gitai"
version = "0.1.0"
description = "AI-powered git commit message generator"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "gitpython",
    "litellm",
    "questionary",
    "tomli-w",
]

[project.scripts]
gitai = "gitai.cli:app"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"